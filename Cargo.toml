[package]
name = "hepre"
version = "0.1.0"
edition = "2021"
description = "Rust cxx wrapper over OpenFHE (CKKS/BFV + PRE) for private clinical diagnostics scoring"
license = "BSD-2-Clause"

[lib]
name = "hepre"
path = "src/lib.rs"

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-build = "1.0"
cc = "1.0"