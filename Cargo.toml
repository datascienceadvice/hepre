[package]
name = "hepre"
version = "0.1.0"
edition = "2021"
description = "Rust cxx wrapper over OpenFHE (CKKS/BFV + PRE) for private clinical diagnostics scoring"
license = "BSD-2-Clause"
repository = "https://github.com/datascienceadvice/hepre"
readme = "README.md"
keywords = ["homomorphic-encryption", "ckks", "proxy-re-encryption", "openfhe", "privacy"]
categories = ["cryptography", "science"]
exclude = ["paper/"]

[lib]
name = "hepre"
path = "src/lib.rs"

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-build = "1.0"
cc = "1.0"

# Разрешения style-линтов на уровне пакета (действуют на все targets).
# Научно-воспроизводимый крейт: числовые алгоритмы сознательно сохраняют
# «буквальную» форму (прямые индексы, явные диапазоны, литералы с полной
# точностью) — см. также комментарий в `src/lib.rs`.
[lints.clippy]
excessive_precision = "allow"
needless_range_loop = "allow"
manual_range_contains = "allow"
manual_memcpy = "allow"
inconsistent_digit_grouping = "allow"
module_inception = "allow"
too_many_arguments = "allow"
manual_div_ceil = "allow"
type_complexity = "allow"
manual_is_multiple_of = "allow"